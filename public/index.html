<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Market</title>
<style>
  body{font-family:sans-serif;max-width:600px;margin:auto;padding:12px;background:#f4f6f8}
  h1{color:#1a5c3a}
  input,select,button{width:100%;padding:10px;margin:4px 0;box-sizing:border-box}
  button{background:#1a5c3a;color:#fff;border:0;border-radius:6px}
  .card{background:#fff;padding:12px;margin:10px 0;border-radius:8px}
  .card img{width:100%;max-height:420px;object-fit:contain;background:#eef1f4;border-radius:6px;margin-bottom:6px}
  .sold{opacity:.5}
  .box{background:#fff;padding:12px;border-radius:8px;margin:10px 0}
  #preview{max-width:100%;max-height:150px;display:none;margin:4px 0;border-radius:6px}
</style>
</head>
<body>
<h1>Campus Market</h1>

<div id="authBox" class="box">
  <input id="name" placeholder="Name (sign up only)">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password (6+ characters)">
  <button onclick="doAuth('register')">Sign up</button>
  <button onclick="doAuth('login')">Log in</button>
</div>

<div id="meBox" class="box" style="display:none">
  Hi <b id="who"></b>
  <button onclick="logout()">Log out</button>
</div>

<input id="search" placeholder="Search items..." oninput="load()">

<div id="sellBox" class="box" style="display:none">
  <h3>Sell an item</h3>
  <input id="title" placeholder="Title">
  <input id="price" type="number" placeholder="Price">
  <select id="category">
    <option>Books</option><option>Electronics</option>
    <option>Clothing</option><option>Furniture</option><option>Other</option>
  </select>
  <input id="description" placeholder="Description">
  <input id="photo" type="file" accept="image/*" onchange="pick(this)">
  <img id="preview">
  <button onclick="post()">Post listing</button>
</div>

<div id="list"></div>

<script>
let token = localStorage.getItem('token');
let user = JSON.parse(localStorage.getItem('user') || 'null');
let photoData = '';
const $ = id => document.getElementById(id);

function ui(){
  $('authBox').style.display = token ? 'none' : 'block';
  $('meBox').style.display = token ? 'block' : 'none';
  $('sellBox').style.display = token ? 'block' : 'none';
  $('who').textContent = user ? user.name : '';
}
function pick(input){
  const file = input.files[0];
  if (!file) { photoData = ''; $('preview').style.display = 'none'; return; }
  const img = new Image();
  img.onload = () => {
    const max = 1000;
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = img.width * scale;
    c.height = img.height * scale;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    photoData = c.toDataURL('image/jpeg', 0.85);
    $('preview').src = photoData;
    $('preview').style.display = 'block';
  };
  img.src = URL.createObjectURL(file);
}
async function doAuth(kind){
  const body = { email: $('email').value, password: $('password').value };
  if (kind === 'register') body.name = $('name').value;
  const r = await fetch('/api/' + kind, { method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) return alert(d.error);
  token = d.token; user = d.user;
  localStorage.setItem('token', token);
  localStorage.setItem('user', JSON.stringify(user));
  ui(); load();
}
function logout(){
  localStorage.clear(); token = null; user = null; ui(); load();
}
async function load(){
  const r = await fetch('/api/listings?q=' + encodeURIComponent($('search').value));
  const items = await r.json();
  $('list').innerHTML = items.map(i => `
    <div class="card ${i.sold ? 'sold' : ''}">
      ${i.image ? `<img src="${i.image}">` : ''}
      <b>${i.title}</b> - $${i.price}<br>
      ${i.category || ''} | ${i.description || ''}<br>
      Seller: ${i.sellerName || 'unknown'} ${i.sellerEmail ? '(' + i.sellerEmail + ')' : ''}<br>
      ${i.sold ? 'SOLD' : (user && i.seller === user.id
        ? `<button onclick="sold('${i._id}')">Mark sold</button>` : '')}
    </div>`).join('');
}
async function post(){
  const body = { image: photoData };
  ['title','price','category','description'].forEach(k => body[k] = $(k).value);
  const r = await fetch('/api/listings', { method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer ' + token},
    body: JSON.stringify(body) });
  if (!r.ok) { const d = await r.json(); return alert(d.error); }
  ['title','price','description','photo'].forEach(k => $(k).value = '');
  photoData = ''; $('preview').style.display = 'none';
  load();
}
async function sold(id){
  await fetch('/api/listings/' + id + '/sold', { method:'PATCH',
    headers:{'Authorization':'Bearer ' + token} });
  load();
}
ui(); load();
</script>
</body>
</html>
